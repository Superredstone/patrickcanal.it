[tool.djlint]
indent = 4
close_void_tagsa = true
format_js = true
format_css = true
max_line_length = 160

[tool.ruff]
exclude = [
    "*migrations*",
    "settings.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
extend-select = ["I"]

