repos:
  - repo: https://github.com/djlint/djLint
    rev: v1.46.1
    hooks:
      - id: djlint-reformat-django
        language: system
      - id: djlint-django
        language: system
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        language: system
      - id: ruff-format
        language: system
