{% extends "base.html" %}
{% load i18n %}
{% block content %}
    <div class="container mt-4">
        <div class="row row-deck row-cards">
            {% for project in object_list %}
                <div class="col-md-4">
                    {% if project.url %}
                        <a class="card card-link card-link-pop" href="{{ project.url }}">
                            <div class="card-body">
                                <h4>{{ project.name }}</h4>
                                <p>{{ project.short_description }}</p>
                            </div>
                        </a>
                    {% else %}
                        <div class="card">
                            <div class="card-body">
                                <h4>{{ project.name }}</h4>
                                <p>{{ project.short_description }}</p>
                            </div>
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
